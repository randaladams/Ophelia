name: Refresh Gradle wrapper

# When the wrapper version changes (for example a Dependabot update), regenerate the
# wrapper jar and scripts with that Gradle version, so every wrapper file matches it.
on:
  push:
    branches: [main]
    paths: [gradle/wrapper/gradle-wrapper.properties]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Regenerate the wrapper with its own Gradle version
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          version=$(sed -n 's/.*gradle-\(.*\)-bin\.zip$/\1/p' "$props")
          sum=$(sed -n 's/^distributionSha256Sum=//p' "$props")
          ./gradlew wrapper --gradle-version "$version" --distribution-type bin --gradle-distribution-sha256-sum "$sum"
          echo "GRADLE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Commit the refreshed files
        run: |
          if git diff --quiet; then echo "Wrapper files already match Gradle $GRADLE_VERSION."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh Gradle wrapper files for Gradle $GRADLE_VERSION"
          git push
