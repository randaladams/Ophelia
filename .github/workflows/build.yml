name: Build Ophelia

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      SIDELOAD_KEYSTORE_BASE64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Use the sideload key from secrets, if set
        if: env.SIDELOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIDELOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sideload.keystore"
          {
            echo "SIDELOAD_KEYSTORE_FILE=$RUNNER_TEMP/sideload.keystore"
            echo "SIDELOAD_KEYSTORE_PASSWORD=${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}"
            echo "SIDELOAD_KEY_ALIAS=${{ secrets.SIDELOAD_KEY_ALIAS }}"
            echo "SIDELOAD_KEY_PASSWORD=${{ secrets.SIDELOAD_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      # Any Gradle deprecation warning fails the build instead of scrolling past.
      - name: Build the sideload APK
        run: .github/scripts/gradle.sh assembleRelease --warning-mode=fail -Dorg.gradle.deprecation.trace=true

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Ophelia.apk

      - name: Build the signed Play bundle
        if: env.PLAY_UPLOAD_KEYSTORE_BASE64 != ''
        env:
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          PLAY_UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.keystore" .github/scripts/gradle.sh bundleRelease -Psigning=play --warning-mode=fail
          cp app/build/outputs/bundle/release/app-release.aab Ophelia.aab
          rm -f "$RUNNER_TEMP/upload.keystore"
          # Show which key signed the bundle, to compare with the upload key in Play Console.
          fp=$(keytool -printcert -jarfile Ophelia.aab | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          [ -n "$fp" ] || { echo "::error title=Play bundle is not signed::Ophelia.aab has no signature"; exit 1; }
          echo "::notice title=Play bundle signed by::Upload key SHA-256 $fp"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v7
        with:
          name: Ophelia-apk
          path: Ophelia.apk

      - name: Keep the Play bundle with this run
        if: env.PLAY_UPLOAD_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: Ophelia-play-bundle
          path: Ophelia.aab

      - name: Publish a release you can download on your phone
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        # A rerun of the same build replaces the APK on its existing release instead of failing.
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" Ophelia.apk --clobber
          else
            gh release create "$TAG" Ophelia.apk \
              --title "Ophelia build ${{ github.run_number }}" \
              --notes "Download Ophelia.apk and open it on your Android phone or tablet to install." \
              --latest
          fi
