plugins {
    id 'com.android.application'
}

android {
    namespace 'com.randaladams.ophelia'
    compileSdk 34

    defaultConfig {
        applicationId 'com.randaladams.ophelia'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '1.8'
    }

    // One fixed key, so each new build installs over the last one and keeps the win record.
    signingConfigs {
        ophelia {
            storeFile file('ophelia.keystore')
            storePassword 'ophelia'
            keyAlias 'ophelia'
            keyPassword 'ophelia'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ophelia
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.ophelia
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
